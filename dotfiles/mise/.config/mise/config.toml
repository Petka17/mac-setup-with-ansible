[tools]
neovim = "nightly"

node = 'lts'
pnpm = '10'
yarn = '1.22.22'
bun = 'latest'
python = '3.12'
uv = 'latest'
go = 'latest'
"npm:ungit" = "1.5.28"
"npm:eas-cli" = "latest"

[settings]
# read version files used by other version managers, such as .nvmrc
idiomatic_version_file_enable_tools = ['node', 'python']
# Auto-activate a uv project's .venv on entering its directory (creating it if
# missing). Only kicks in when a uv.lock is present.
python.uv_venv_auto = "create|source"

[settings.status]
show_tools = false
show_env = false
